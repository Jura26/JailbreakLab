services:
  backend:
    build: ./backend
    container_name: projekt-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        reservations:
          cpus: '1'
          devices:
            - driver: nvidia
              count: all # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: projekt-frontend
    ports:
      - "5173:5173"
    volumes:
    - ./frontend:/app
    - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend

